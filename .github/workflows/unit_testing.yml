name: Unit Testing

on:
  push:
    branches: [main, develop]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/unit_testing.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/unit_testing.yml"
  workflow_dispatch:

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + dev / optional extras
        # The openswmm.engine wheel is a required dep; CI tries to install
        # it together with the optional MO / Platypus / Viz extras. If the
        # engine wheel isn't yet published for this Python version, fall
        # back to a minimal install so the unit-only tier still runs.
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,mo,platypus,viz]" || pip install -e ".[dev]"

      - name: Run unit tests
        # Pick the tier based on whether the engine actually imports
        # cleanly on this runner. Integration tests require the engine.
        shell: bash
        run: |
          if python -c "import openswmm.engine" 2>/dev/null; then
            pytest tests/unit/ -v --cov=openswmm_gymnasium --cov-report=xml --cov-report=term-missing
          else
            pytest tests/unit/ -v -m "not integration"
          fi

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          flags: unit
          fail_ci_if_error: false
